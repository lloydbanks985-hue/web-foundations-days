<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Day 5 - Users</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
    label { display: block; margin: 1rem 0 0.25rem; font-weight: 600; }
    input { padding: 0.4rem; width: 100%; box-sizing: border-box; }
    button { padding: 0.5rem 1rem; }
    #status { min-height: 1.5rem; }
    #status.error { color: #b00020; }
    #users-list { list-style: none; padding: 0; }
    #users-list li { border: 1px solid #ccc; border-radius: 6px; padding: 0.75rem; margin-bottom: 0.5rem; }
    #users-list li strong { display: block; }
  </style>
</head>
<body>
  <h1>Users</h1>
  <button id="load-users" type="button">Load users</button>

  <label for="filter-input">Filter by name</label>
  <input id="filter-input" type="text" placeholder="Type a name...">

  <p id="status" role="status"></p>
  <ul id="users-list"></ul>

  <script src="users.js" defer></script>
</body>
</html>
